name: Build VeloStride APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare debug keystore, env file, and Firebase config
        id: prep
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
        run: |
          GENERATED=false
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > debug.keystore
            else
              echo "Generating fallback debug.keystore with keytool..."
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              GENERATED=true
            fi
          fi

          echo "generated=$GENERATED" >> "$GITHUB_OUTPUT"
          echo "=== Debug Keystore Fingerprints ==="
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true

          if [ "$GENERATED" = "true" ]; then
            SETUP_DIR="${{ runner.temp }}/keystore-setup"
            mkdir -p "$SETUP_DIR"
            base64 -w 0 debug.keystore > "$SETUP_DIR/debug.keystore.base64"
            keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" > "$SETUP_DIR/fingerprints.txt" || true
          fi

          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '"project_info"'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n' | base64 -d > app/google-services.json
            fi
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json not found. Add GOOGLE_SERVICES_JSON secret in GitHub repo settings to enable Google Sign-In and Firebase in the built APK."
          fi
          CLEAN_APPCHECK_TOKEN=$(printf '%s' "$FIREBASE_APPCHECK_DEBUG_TOKEN" | tr -d '[:space:]')
          if [ -n "$CLEAN_APPCHECK_TOKEN" ]; then
            mkdir -p app/src/debug/res/values
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<resources>' \
              "    <string name=\"firebase_appcheck_debug_token\" translatable=\"false\">${CLEAN_APPCHECK_TOKEN}</string>" \
              '</resources>' > app/src/debug/res/values/appcheck_debug.xml
            echo "Injected FIREBASE_APPCHECK_DEBUG_TOKEN for debug build."
          fi

      - name: Upload one-time keystore setup files (if newly generated)
        if: steps.prep.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: velostride-keystore-setup
          path: ${{ runner.temp }}/keystore-setup/
          retention-days: 1

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload VeloStride Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VeloStride-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
